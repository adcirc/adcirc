# #######################################################################
# ADCIRC CircleCI Yaml
#
# Written By: Zach Cobell
#
# Generated for: CircleCI v2.1
#
# This yaml runs a series of build tests
# and acceptance tests used to ensure the
# ADCIRC code is checked before 
# accepting code into the main branch
#
# #######################################################################
version: 2.1

# #############################
# Pipeline parameters
# #############################
parameters:
  ci-version:
    type: string
    default: "v57.0.0"
  # Built from https://github.com/adcirc/adcirc-ci-docker. The same image is
  # published for amd64 (Intel oneAPI) and arm64 (GCC).
  ci-image:
    type: string
    default: "adcircorg/adcirc-ci:2026.2.0"

# #############################
# Executor Definitions
# #############################
# The working directory is set explicitly because the CMake build trees are
# passed to the test jobs through the workspace and must be attached at the
# same absolute path they were built in (the executables carry an RPATH).
executors:
  intel_executor:
    docker:
      - image: << pipeline.parameters.ci-image >>
    working_directory: /home/adcirc/project
  gcc_executor:
    docker:
      - image: << pipeline.parameters.ci-image >>
    resource_class: arm.medium
    working_directory: /home/adcirc/project

# #############################
# Aliases for the environments
# #############################
default_env: &default_env
    executor: intel_executor

default_env_gcc: &default_env_gcc
    executor: gcc_executor

# #############################
# Reusable commands
# #############################
commands:
  cmake_build:
    description: Configure and build ADCIRC with CMake and Ninja
    parameters:
      description:
        type: string
      compiler:
        description: Compiler family available in the CI image for this architecture
        type: enum
        enum: ["intel", "gcc"]
      options:
        description: Additional CMake options for this configuration
        type: string
        default: ""
      build_dir:
        description: >-
          CMake build directory. Builds that feed test jobs each use their own directory so
          that their workspace layers cannot overwrite one another.
        type: string
        default: "build"
      build_type:
        description: CMake build type
        type: enum
        enum: ["Release", "RelWithDebInfo"]
        default: "Release"
    steps:
      - run:
          name: << parameters.description >>
          command: |
            source /opt/spack-environment/activate.sh
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              compiler_args=(
                -DCMAKE_C_COMPILER=icx
                -DCMAKE_CXX_COMPILER=icpx
                -DCMAKE_Fortran_COMPILER=ifx
                -DCMAKE_Fortran_FLAGS_RELEASE="-O2 -fp-model=precise"
                -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -fp-model=precise"
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fp-model=precise"
              )
            else
              compiler_args=(
                -DCMAKE_C_COMPILER=gcc
                -DCMAKE_CXX_COMPILER=g++
                -DCMAKE_Fortran_COMPILER=gfortran
              )
            fi
            cmake -S . -B << parameters.build_dir >> -G Ninja \
              -DADCIRC_DEVELOPER_MODE=ON \
              -DCMAKE_BUILD_TYPE=<< parameters.build_type >> \
              "${compiler_args[@]}" \
              -DBUILD_ADCIRC=ON \
              -DBUILD_PADCIRC=ON \
              -DBUILD_ADCSWAN=ON \
              -DBUILD_PADCSWAN=ON \
              -DBUILD_ADCPREP=ON \
              -DBUILD_UTILITIES=ON \
              -DBUILD_ASWIP=ON \
              -DBUILD_SWAN=ON \
              -DBUILD_PUNSWAN=ON \
              -DBUILD_LIBADCIRC_STATIC=ON \
              -DBUILD_LIBADCIRC_SHARED=ON \
              << parameters.options >>
            cmake --build << parameters.build_dir >>

  check_build:
    description: Check that the attached workspace holds the build this test needs
    parameters:
      build_dir:
        type: string
    steps:
      # A missing build should fail here, by name, rather than later inside the test runner
      - run:
          name: Check for executables in << parameters.build_dir >>
          command: |
            grep -m1 -E "model name|CPU part" /proc/cpuinfo || true
            missing=0
            for exe in adcirc padcirc adcprep; do
              if [[ ! -x "/home/adcirc/project/<< parameters.build_dir >>/${exe}" ]]; then
                echo "ERROR: ${exe} was not found in /home/adcirc/project/<< parameters.build_dir >>"
                missing=1
              fi
            done
            if [[ ${missing} -ne 0 ]]; then
              ls -la /home/adcirc/project/<< parameters.build_dir >> || true
            fi
            exit ${missing}

  get_test_data:
    description: Download and unpack one test case from the test suite bucket
    parameters:
      test_name:
        type: string
    steps:
      - run:
          name: Get test data from AWS, << parameters.test_name >>
          command: |
            source /opt/spack-environment/activate.sh
            export AWS_DEFAULT_REGION=us-east-1
            if [[ -n "${AWS_ROLE_ARN:-}" ]]; then
              # AWS_ROLE_ARN comes from the adcirc-ci context; the AWS CLI exchanges
              # the job's OIDC token for short-lived credentials for that role
              if [[ -z "${CIRCLE_OIDC_TOKEN_V2:-}" ]]; then
                echo "ERROR: AWS_ROLE_ARN is set but this job has no OIDC token"
                exit 1
              fi
              (umask 077 && printf '%s' "${CIRCLE_OIDC_TOKEN_V2}" > /tmp/oidc-token)
              export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token
              auth=()
            else
              echo "AWS_ROLE_ARN is not set (no adcirc-ci context, e.g. a pull request from a fork); downloading without credentials"
              auth=(--no-sign-request)
            fi
            aws s3 cp "${auth[@]}" \
              s3://adcirc-testsuite/adcirc/<<pipeline.parameters.ci-version>>/<<parameters.test_name>>.tar.gz \
              /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: Unpack Tests
          command: mkdir /home/adcirc/adcirc-cg-testsuite && cd /home/adcirc/adcirc-cg-testsuite && tar -xvzf /home/adcirc/adcirc_testsuite.tar.gz

  legacy_build:
    description: Build ADCIRC with the legacy makefile in work/
    parameters:
      description:
        type: string
      compiler:
        description: >-
          Compiler family available in the CI image for this architecture. Each family has its
          own profile in work/cmplrflags.mk and its own SWAN macros file:
          intel -> compiler=circleci and macros.inc.circleci,
          gcc -> compiler=gfortran and macros.inc.gfortran
        type: enum
        enum: ["intel", "gcc"]
      options:
        description: Additional make variables for this configuration
        type: string
        default: ""
    steps:
      - run:
          name: Configure SWAN for legacy makefile
          command: |
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              cp thirdparty/swan/macros.inc.circleci thirdparty/swan/macros.inc
            else
              cp thirdparty/swan/macros.inc.gfortran thirdparty/swan/macros.inc
            fi
      - run:
          name: << parameters.description >>
          command: |
            source /opt/spack-environment/activate.sh
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              profile=circleci
            else
              profile=gfortran
            fi
            cd work
            make compiler="${profile}" << parameters.options >> \
              adcirc padcirc adcprep adccmp inflate hot2asc hstime aswip p15 build13 build12 libadc adcswan padcswan

# #######################################
# Jobs that will be run in the workflow
# #######################################
jobs:
  build_legacy_without_netcdf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC without external libraries using legacy makefile
          compiler: intel

  build_legacy_with_netcdf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC with netCDF using legacy makefile
          compiler: intel
          options: >-
            NETCDF=enable
            NETCDF4=enable
            NETCDF4_COMPRESSION=enable
            NETCDFHOME=$NETCDF_FORTRAN_HOME
            HDF5HOME=$HDF5HOME
            NETCDF_C_HOME=$NETCDFHOME

  build_legacy_with_netcdf_and_xdmf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC with netCDF and XDMF using legacy makefile
          compiler: intel
          options: >-
            NETCDF=enable
            NETCDF4=enable
            NETCDF4_COMPRESSION=enable
            NETCDFHOME=$NETCDF_FORTRAN_HOME
            HDF5HOME=$HDF5HOME
            NETCDF_C_HOME=$NETCDFHOME
            XDMF=enable
            XDMFHOME=$XDMFHOME

  build_cmake_without_netcdf_gcc:
    <<: *default_env_gcc
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC without external libraries using CMake
          compiler: gcc

  build_cmake_with_netcdf_gcc:
    <<: *default_env_gcc
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF using CMake
          compiler: gcc
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME

  build_cmake_without_netcdf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC without external libraries using CMake
          compiler: intel
          build_dir: build-base
      - persist_to_workspace:
          root: /home/adcirc/project
          paths:
            - build-base

  build_cmake_with_netcdf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
          build_dir: build-netcdf
      - persist_to_workspace:
          root: /home/adcirc/project
          paths:
            - build-netcdf

  build_cmake_with_netcdf_and_xdmf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF and XDMF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
            -DENABLE_OUTPUT_XDMF=ON
            -DXDMFHOME=$XDMFHOME
            -DHDF5_ROOT=$HDF5HOME

  build_cmake_with_netcdf_and_xdmf_grib:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with Grib, netCDF, and XDMF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
            -DENABLE_OUTPUT_XDMF=ON
            -DXDMFHOME=$XDMFHOME
            -DENABLE_GRIB2=ON
          build_dir: build-grib2
      - persist_to_workspace:
          root: /home/adcirc/project
          paths:
            - build-grib2

  run_test:
    <<: *default_env
    parameters:
      test_name:
        description: "Name of test job to be run"
        default: "adcirc_quarterannular-2d"
        type: string
      build_dir:
        description: CMake build directory, persisted to the workspace by the build job this test requires
        type: enum
        enum: ["build-base", "build-netcdf", "build-grib2"]
    steps:
      - attach_workspace:
          at: /home/adcirc/project
      - check_build:
          build_dir: << parameters.build_dir >>
      - get_test_data:
          test_name: << parameters.test_name >>
      - run:
          name: Run Test <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && cd /home/adcirc/adcirc-cg-testsuite && ./RunSingleTest.sh /home/adcirc/project/<<parameters.build_dir>> <<parameters.test_name>>
          no_output_timeout: 7200
      - run:
          name: Store log artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.log" -exec cp {} /tmp/artifacts/. \;
          when: always
      - run:
          name: Store graphics artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.png" -exec cp {} /tmp/artifacts/. \;
          when: always
      - store_artifacts:
          path: /tmp/artifacts

  # ############################################################
  # Coverage. ifx does not instrument Fortran for coverage, so
  # coverage comes from a gfortran build on the arm executor.
  # Its solutions are compared with the Intel control files and
  # reported, but a mismatch is not a failure; the Intel test
  # jobs above remain the check on the solution.
  # ############################################################
  build_cmake_coverage_gcc:
    <<: *default_env_gcc
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with gfortran coverage instrumentation
          compiler: gcc
          build_dir: build-coverage
          build_type: RelWithDebInfo
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
            -DENABLE_OUTPUT_XDMF=ON
            -DXDMFHOME=$XDMFHOME
            -DENABLE_DATETIME=ON
            -DENABLE_GRIB2=ON
            -DCMAKE_Fortran_FLAGS=--coverage
            -DCMAKE_C_FLAGS=--coverage
            -DCMAKE_CXX_FLAGS=--coverage
            -DCMAKE_EXE_LINKER_FLAGS=--coverage
            -DCMAKE_SHARED_LINKER_FLAGS=--coverage
      - persist_to_workspace:
          root: /home/adcirc/project
          paths:
            - build-coverage

  coverage_test:
    <<: *default_env_gcc
    parameters:
      test_name:
        description: "Name of test job to be run"
        type: string
    environment:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      # The sources are needed to turn the coverage counters into line coverage
      - checkout
      - attach_workspace:
          at: /home/adcirc/project
      - check_build:
          build_dir: build-coverage
      - get_test_data:
          test_name: << parameters.test_name >>
      - run:
          name: Run << parameters.test_name >> for coverage (differences from the Intel controls are reported, not failed)
          command: |
            source /opt/spack-environment/activate.sh
            mkdir -p /tmp/artifacts
            cd /home/adcirc/adcirc-cg-testsuite
            ./RunSingleTest.sh /home/adcirc/project/build-coverage << parameters.test_name >> \
              --allow-mismatch \
              --report /tmp/artifacts/<< parameters.test_name >>.comparison.json
          no_output_timeout: 7200
      - run:
          name: Collect coverage for << parameters.test_name >>
          command: |
            source /opt/spack-environment/activate.sh
            python3 -m pip install --quiet --target /tmp/tools gcovr==8.8
            mkdir -p coverage
            # Long runs push some line counts past gcovr's sanity threshold
            PYTHONPATH=/tmp/tools python3 -m gcovr \
              --root /home/adcirc/project \
              --exclude 'thirdparty/' \
              --exclude 'build-coverage/' \
              --gcov-executable gcov \
              --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
              --json coverage/<< parameters.test_name >>.json \
              build-coverage
            gzip coverage/<< parameters.test_name >>.json
            cp /tmp/artifacts/<< parameters.test_name >>.comparison.json coverage/
      - persist_to_workspace:
          root: /home/adcirc/project
          paths:
            - coverage/<< parameters.test_name >>.json.gz
            - coverage/<< parameters.test_name >>.comparison.json
      - run:
          name: Store log artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.log" -exec cp {} /tmp/artifacts/. \;
          when: always
      - store_artifacts:
          path: /tmp/artifacts

  # Merging here and uploading once means Codecov never sees a partial report
  coverage_report:
    <<: *default_env_gcc
    steps:
      - checkout
      - attach_workspace:
          at: /home/adcirc/project
      - run:
          name: Summarize differences from the Intel control solutions
          command: |
            mkdir -p /tmp/artifacts
            python3 - coverage/*.comparison.json \<<'EOF' | tee /tmp/artifacts/comparison_summary.txt
            import json
            import sys

            # Each report is the test runner's --report output: {test: {portion: status}}
            differing = []
            n_tests = 0
            for path in sorted(sys.argv[1:]):
                with open(path) as f:
                    report = json.load(f)
                for test, status in report.items():
                    n_tests += 1
                    for portion in ("coldstart", "hotstart"):
                        if portion in status and not status[portion]["passed"]:
                            files = ", ".join(status[portion]["failed_files"])
                            differing.append(f"{test} ({portion}): {files}")
            print(
                f"{n_tests} coverage runs, {len(differing)} portions differ from the Intel control solutions. "
                "This is expected for the gfortran build and is not a failure."
            )
            for d in differing:
                print(f"  {d}")
            EOF
      - run:
          name: Merge coverage
          command: |
            source /opt/spack-environment/activate.sh
            python3 -m pip install --quiet --target /tmp/tools gcovr==8.8 codecov-cli==11.3.2
            mkdir -p /tmp/artifacts/html
            PYTHONPATH=/tmp/tools python3 -m gcovr \
              --root /home/adcirc/project \
              --json-add-tracefile 'coverage/*.json.gz' \
              --cobertura coverage.xml \
              --html-details /tmp/artifacts/html/index.html \
              --print-summary
      - run:
          name: Upload coverage to Codecov
          command: |
            source /opt/spack-environment/activate.sh
            if [[ -z "${CODECOV_TOKEN:-}" ]]; then
              echo "CODECOV_TOKEN is not available (for example, on a pull request from a fork), so the report is not uploaded"
              exit 0
            fi
            PYTHONPATH=/tmp/tools /tmp/tools/bin/codecovcli --verbose --disable-telem upload-process \
              --git-service github \
              --slug "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              --disable-search \
              --plugin noop \
              --fail-on-error \
              --file coverage.xml \
              --name "circleci-${CIRCLE_WORKFLOW_ID}" \
              --token "${CODECOV_TOKEN}"
      - store_artifacts:
          path: /tmp/artifacts

# ##############################
# Workflows in the CI process
# ##############################
workflows:
  version: 2
  build_and_test:
    jobs:
      - build_legacy_without_netcdf
      - build_legacy_with_netcdf
      - build_legacy_with_netcdf_and_xdmf
      - build_cmake_without_netcdf_gcc
      - build_cmake_with_netcdf_gcc
      - build_cmake_with_netcdf_and_xdmf
      - build_cmake_without_netcdf
      - build_cmake_with_netcdf
      - build_cmake_with_netcdf_and_xdmf_grib
      - run_test:
            name: test_base-<< matrix.test_name >>
            context: adcirc-ci
            build_dir: build-base
            requires:
                - build_cmake_without_netcdf
            matrix:
                parameters:
                    test_name: &base_tests
                        - adcirc_quarterannular-2d
                        - adcirc_quarterannular-2d-parallel
                        - adcirc_quarterannular-2d-hotstart
                        - adcirc_quarterannular-2d-parallel-hotstart
                        - adcirc_quarterannular-2d-parallel-writer
                        - adcirc_swan_apes_irene
                        - adcirc_quarterannular-2d-hotstart-harmonic
      - run_test:
            name: test_netcdf-<< matrix.test_name >>
            context: adcirc-ci
            build_dir: build-netcdf
            requires:
                - build_cmake_with_netcdf
            matrix:
                parameters:
                    test_name: &netcdf_tests
                        - adcirc_quarterannular-2d-netcdf
                        - adcirc_quarterannular-2d-netcdf-hotstart
                        - adcirc_quarterannular-2d-parallel-netcdf
                        - adcirc_quarterannular-2d-parallel-netcdf-hotstart
                        - adcirc_quarterannular-2d-parallel-netcdf-writer
                        - adcirc_katrina-2d
                        - adcirc_katrina-2d-nws13
                        - adcirc_katrina-2d-nws13-parallel
                        - adcirc_katrina-2d-parallel
                        - adcirc_nws30_wlcorrection
                        - adcirc_nws30_wlcorrection-parallel
                        - adcirc_slopingbeach_vew1d-parallel
                        - adcirc_subgrid-serial
                        - adcirc_subgrid-parallel
                        - adcirc_swan_apes_irene-parallel
                        - adcirc_global-tide-2d-full-tip-JPL-emphemerides-parallel
                        - adcirc_global-tide-2d-full-tip-analytical-serial
                        - adcirc_irene_cle15-parallel
                        - adcirc_irene_holland_lc12
                        - adcirc_irene_holland_new
                        - adcirc_irene_cle15
                        - adcirc_irene_cle15_lc12-parallel
                        - adcirc_irene_holland_legacy-parallel
                        - adcirc_basin-3d-parallel
                        - adcirc_quarterannular-2d-parallel-netcdf-hotstart-harmonic
                        - adcirc_basin-3d-parallel-hotstart
                        - adcirc_basin-3d-hotstart
      - run_test:
            name: test_grib2-<< matrix.test_name >>
            context: adcirc-ci
            build_dir: build-grib2
            requires:
                - build_cmake_with_netcdf_and_xdmf_grib
            matrix:
                parameters:
                    test_name: &grib2_tests
                        - adcirc_alaska_ice-2d
                        - adcirc_apes
                        - adcirc_apes-parallel
                        - adcirc_global-alidisp+buoyancy-2d-parallel
                        - adcirc_global_nws10-2d
                        - adcirc_global-tide-2d
                        - adcirc_global-tide+surge-2d
                        - adcirc_global-tide+surge-netcdfsal-2d
                        - adcirc_ideal_channel-2d-parallel
                        - adcirc_ideal_channel-woffset-2d-parallel
                        - adcirc_internal_overflow
                        - adcirc_internal_overflow-parallel
                        - adcirc_rivers
                        - adcirc_rivers-parallel
                        - adcirc_rivers-rotated-parallel
                        - adcirc_shinnecock_inlet
                        - adcirc_shinnecock_inlet-parallel
                        - adcirc_timevaryingweirs-parallel
                        - adcirc_baroclinic_2d_serial
                        - adcirc_baroclinic_2d_parallel
                        - adcirc_baroclinic_internaltide_2d
                        - adcirc_global-tide-2d-full-tip-JPL-emphemerides-serial
                        - adcirc_global-tide-2d-full-tip-analytical-parallel
                        - adcirc_global-nws14-inset-parallel
                        - adcirc_irene_cle15_lc12
                        - adcirc_irene_holland_legacy
                        - adcirc_irene_holland_new-parallel
                        - adcirc_quarterannular-2d-xdmf

  # Not a required check: a failure here (for example, the gfortran build
  # crashing on a case) is visible on the pull request without blocking it
  coverage:
    jobs:
      - build_cmake_coverage_gcc
      - coverage_test:
          name: coverage-<< matrix.test_name >>
          context: adcirc-ci
          requires:
            - build_cmake_coverage_gcc
          matrix:
            alias: coverage_tests_base
            parameters:
              test_name: *base_tests
      - coverage_test:
          name: coverage-<< matrix.test_name >>
          context: adcirc-ci
          requires:
            - build_cmake_coverage_gcc
          matrix:
            alias: coverage_tests_netcdf
            parameters:
              test_name: *netcdf_tests
      - coverage_test:
          name: coverage-<< matrix.test_name >>
          context: adcirc-ci
          requires:
            - build_cmake_coverage_gcc
          matrix:
            alias: coverage_tests_grib2
            parameters:
              test_name: *grib2_tests
      - coverage_report:
          context: adcirc-ci
          requires:
            - coverage_tests_base
            - coverage_tests_netcdf
            - coverage_tests_grib2
