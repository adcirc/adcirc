# #######################################################################
# ADCIRC CircleCI Yaml
#
# Written By: Zach Cobell
#
# Generated for: CircleCI v2.1
#
# This yaml runs a series of build tests
# and acceptance tests used to ensure the
# ADCIRC code is checked before 
# accepting code into the main branch
#
# #######################################################################
version: 2.1

# #############################
# Pipeline parameters
# #############################
parameters:
  ci-version:
    type: string
    default: "v57.0.0"
  # Built from https://github.com/adcirc/adcirc-ci-docker. The same image is
  # published for amd64 (Intel oneAPI) and arm64 (GCC).
  ci-image:
    type: string
    default: "adcircorg/adcirc-ci:2026.1.0"

# #############################
# Executor Definitions
# #############################
executors:
  intel_executor:
    docker:
      - image: << pipeline.parameters.ci-image >>
  gcc_executor:
    docker:
      - image: << pipeline.parameters.ci-image >>
    resource_class: arm.medium

# #############################
# Aliases for the environments
# #############################
default_env: &default_env
    executor: intel_executor

default_env_gcc: &default_env_gcc
    executor: gcc_executor

# #############################
# Reusable commands
# #############################
commands:
  cmake_build:
    description: Configure and build ADCIRC with CMake and Ninja
    parameters:
      description:
        type: string
      compiler:
        description: Compiler family available in the CI image for this architecture
        type: enum
        enum: ["intel", "gcc"]
      options:
        description: Additional CMake options for this configuration
        type: string
        default: ""
    steps:
      - run:
          name: << parameters.description >>
          command: |
            source /opt/spack-environment/activate.sh
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              compiler_args=(
                -DCMAKE_C_COMPILER=icx
                -DCMAKE_CXX_COMPILER=icpx
                -DCMAKE_Fortran_COMPILER=ifx
                -DCMAKE_Fortran_FLAGS_RELEASE="-O2 -fp-model=precise"
                -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -fp-model=precise"
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fp-model=precise"
              )
            else
              compiler_args=(
                -DCMAKE_C_COMPILER=gcc
                -DCMAKE_CXX_COMPILER=g++
                -DCMAKE_Fortran_COMPILER=gfortran
              )
            fi
            cmake -S . -B build -G Ninja \
              -DADCIRC_DEVELOPER_MODE=ON \
              -DCMAKE_BUILD_TYPE=Release \
              "${compiler_args[@]}" \
              -DBUILD_ADCIRC=ON \
              -DBUILD_PADCIRC=ON \
              -DBUILD_ADCSWAN=ON \
              -DBUILD_PADCSWAN=ON \
              -DBUILD_ADCPREP=ON \
              -DBUILD_UTILITIES=ON \
              -DBUILD_ASWIP=ON \
              -DBUILD_SWAN=ON \
              -DBUILD_PUNSWAN=ON \
              -DBUILD_LIBADCIRC_STATIC=ON \
              -DBUILD_LIBADCIRC_SHARED=ON \
              << parameters.options >>
            cmake --build build

  legacy_build:
    description: Build ADCIRC with the legacy makefile in work/
    parameters:
      description:
        type: string
      compiler:
        description: >-
          Compiler family available in the CI image for this architecture. Each family has its
          own profile in work/cmplrflags.mk and its own SWAN macros file:
          intel -> compiler=circleci and macros.inc.circleci,
          gcc -> compiler=gfortran and macros.inc.gfortran
        type: enum
        enum: ["intel", "gcc"]
      options:
        description: Additional make variables for this configuration
        type: string
        default: ""
    steps:
      - run:
          name: Configure SWAN for legacy makefile
          command: |
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              cp thirdparty/swan/macros.inc.circleci thirdparty/swan/macros.inc
            else
              cp thirdparty/swan/macros.inc.gfortran thirdparty/swan/macros.inc
            fi
      - run:
          name: << parameters.description >>
          command: |
            source /opt/spack-environment/activate.sh
            if [[ "<< parameters.compiler >>" == "intel" ]]; then
              profile=circleci
            else
              profile=gfortran
            fi
            cd work
            make compiler="${profile}" << parameters.options >> \
              adcirc padcirc adcprep adccmp inflate hot2asc hstime aswip p15 build13 build12 libadc adcswan padcswan

# #######################################
# Jobs that will be run in the workflow
# #######################################
jobs:
  build_legacy_without_netcdf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC without external libraries using legacy makefile
          compiler: intel

  build_legacy_with_netcdf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC with netCDF using legacy makefile
          compiler: intel
          options: >-
            NETCDF=enable
            NETCDF4=enable
            NETCDF4_COMPRESSION=enable
            NETCDFHOME=$NETCDF_FORTRAN_HOME
            HDF5HOME=$HDF5HOME
            NETCDF_C_HOME=$NETCDFHOME

  build_legacy_with_netcdf_and_xdmf:
    <<: *default_env
    steps:
      - checkout
      - legacy_build:
          description: Build ADCIRC with netCDF and XDMF using legacy makefile
          compiler: intel
          options: >-
            NETCDF=enable
            NETCDF4=enable
            NETCDF4_COMPRESSION=enable
            NETCDFHOME=$NETCDF_FORTRAN_HOME
            HDF5HOME=$HDF5HOME
            NETCDF_C_HOME=$NETCDFHOME
            XDMF=enable
            XDMFHOME=$XDMFHOME

  build_cmake_without_netcdf_gcc:
    <<: *default_env_gcc
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC without external libraries using CMake
          compiler: gcc

  build_cmake_with_netcdf_gcc:
    <<: *default_env_gcc
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF using CMake
          compiler: gcc
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME

  build_cmake_without_netcdf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC without external libraries using CMake
          compiler: intel
      - save_cache:
          key: adcirc-base-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - /home/adcirc/project

  build_cmake_with_netcdf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
      - save_cache:
          key: adcirc-netcdf-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - /home/adcirc/project

  build_cmake_with_netcdf_and_xdmf:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with netCDF and XDMF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
            -DENABLE_OUTPUT_XDMF=ON
            -DXDMFHOME=$XDMFHOME
            -DHDF5_ROOT=$HDF5HOME

  build_cmake_with_netcdf_and_xdmf_grib:
    <<: *default_env
    steps:
      - checkout
      - cmake_build:
          description: Build ADCIRC with Grib, netCDF, and XDMF using CMake
          compiler: intel
          options: >-
            -DENABLE_OUTPUT_NETCDF=ON
            -DNETCDF_F90_ROOT=$NETCDF_FORTRAN_HOME
            -DNETCDF_DIR=$NETCDFHOME
            -DENABLE_OUTPUT_XDMF=ON
            -DXDMFHOME=$XDMFHOME
            -DENABLE_DATETIME=ON
            -DENABLE_GRIB2=ON
      - save_cache:
          key: adcirc-grib2-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - /home/adcirc/project

  test_base:
    <<: *default_env
    parameters:
      test_name:
        description: "Name of test job to be run"
        default: "adcirc_quarterannular-2d"
        type: string
    steps:
      - restore_cache:
          name: Restore base build cache
          keys:
            - adcirc-base-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
      - run:
          name: Get test data from AWS, <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && aws s3 --no-sign-request cp s3://adcirc-testsuite/adcirc/<<pipeline.parameters.ci-version>>/<<parameters.test_name>>.tar.gz /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: Unpack Tests
          command: mkdir /home/adcirc/adcirc-cg-testsuite && cd /home/adcirc/adcirc-cg-testsuite && tar -xvzf /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: Run Test <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && cd /home/adcirc/adcirc-cg-testsuite && ./RunSingleTest.sh /home/adcirc/project/build <<parameters.test_name>>
          no_output_timeout: 7200
      - run:
          name: Store log artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.log" -exec cp {} /tmp/artifacts/. \;
          when: always
      - run:
          name: Store graphics artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.png" -exec cp {} /tmp/artifacts/. \;
          when: always
      - store_artifacts:
          path: /tmp/artifacts

  test_netcdf:
    <<: *default_env
    parameters:
      test_name:
        description: "Name of test job to be run"
        default: "adcirc_quarterannular-2d"
        type: string
    steps:
      - restore_cache:
          name: Restore netcdf build cache
          keys:
            - adcirc-netcdf-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
      - run:
          name: Get test data from AWS, <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && aws s3 --no-sign-request cp s3://adcirc-testsuite/adcirc/<<pipeline.parameters.ci-version>>/<<parameters.test_name>>.tar.gz /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: Unpack Tests
          command: mkdir /home/adcirc/adcirc-cg-testsuite && cd /home/adcirc/adcirc-cg-testsuite && tar -xvzf /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && cd /home/adcirc/adcirc-cg-testsuite && ./RunSingleTest.sh /home/adcirc/project/build <<parameters.test_name>>
          no_output_timeout: 7200
      - run:
          name: Store log artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.log" -exec cp {} /tmp/artifacts/. \;
          when: always
      - run:
          name: Store graphics artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.png" -exec cp {} /tmp/artifacts/. \;
          when: always
      - store_artifacts:
          path: /tmp/artifacts

  test_grib2:
    <<: *default_env
    parameters:
      test_name:
        description: "Name of test job to be run"
        default: "adcirc_quarterannular-2d"
        type: string
    steps:
      - restore_cache:
          name: Restore grib2 build cache
          keys:
            - adcirc-grib2-{{ arch }}-{{ .Environment.CIRCLE_SHA1 }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
      - run:
          name: Get test data from AWS, <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && aws s3 --no-sign-request cp s3://adcirc-testsuite/adcirc/<<pipeline.parameters.ci-version>>/<<parameters.test_name>>.tar.gz /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: Unpack Tests
          command: mkdir /home/adcirc/adcirc-cg-testsuite && cd /home/adcirc/adcirc-cg-testsuite && tar -xvzf /home/adcirc/adcirc_testsuite.tar.gz
      - run:
          name: <<parameters.test_name>>
          command: source /opt/spack-environment/activate.sh && cd /home/adcirc/adcirc-cg-testsuite && ./RunSingleTest.sh /home/adcirc/project/build <<parameters.test_name>>
          no_output_timeout: 7200
      - run:
          name: Store log artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.log" -exec cp {} /tmp/artifacts/. \;
          when: always
      - run:
          name: Store graphics artifacts
          command: |
            mkdir -p /tmp/artifacts
            find /home/adcirc/adcirc-cg-testsuite/adcirc*/<<parameters.test_name>> -name "*.png" -exec cp {} /tmp/artifacts/. \;
          when: always
      - store_artifacts:
          path: /tmp/artifacts

# ##############################
# Workflows in the CI process
# ##############################
workflows:
  version: 2
  build_and_test:
    jobs:
      - build_legacy_without_netcdf
      - build_legacy_with_netcdf
      - build_legacy_with_netcdf_and_xdmf
      - build_cmake_without_netcdf_gcc
      - build_cmake_with_netcdf_gcc
      - build_cmake_with_netcdf_and_xdmf
      - build_cmake_without_netcdf
      - build_cmake_with_netcdf
      - build_cmake_with_netcdf_and_xdmf_grib
      - test_base:
            requires:
                - build_cmake_without_netcdf
            matrix:
                parameters:
                    test_name:
                        - adcirc_quarterannular-2d
                        - adcirc_quarterannular-2d-parallel
                        - adcirc_quarterannular-2d-hotstart
                        - adcirc_quarterannular-2d-parallel-hotstart
                        - adcirc_quarterannular-2d-parallel-writer
                        - adcirc_swan_apes_irene
      - test_netcdf:
            requires:
                - build_cmake_with_netcdf
            matrix:
                parameters:
                    test_name:
                        - adcirc_quarterannular-2d-netcdf
                        - adcirc_quarterannular-2d-netcdf-hotstart
                        - adcirc_quarterannular-2d-parallel-netcdf
                        - adcirc_quarterannular-2d-parallel-netcdf-hotstart
                        - adcirc_quarterannular-2d-parallel-netcdf-writer
                        - adcirc_katrina-2d
                        - adcirc_katrina-2d-nws13
                        - adcirc_katrina-2d-nws13-parallel
                        - adcirc_katrina-2d-parallel
                        - adcirc_nws30_wlcorrection
                        - adcirc_nws30_wlcorrection-parallel
                        - adcirc_slopingbeach_vew1d-parallel
                        - adcirc_subgrid-serial
                        - adcirc_subgrid-parallel
                        - adcirc_swan_apes_irene-parallel
                        - adcirc_global-tide-2d-full-tip-JPL-emphemerides-parallel
                        - adcirc_global-tide-2d-full-tip-analytical-serial
                        - adcirc_irene_cle15-parallel
                        - adcirc_irene_holland_lc12
                        - adcirc_irene_holland_new
                        - adcirc_irene_cle15
                        - adcirc_irene_cle15_lc12-parallel
                        - adcirc_irene_holland_legacy-parallel
                        - adcirc_basin-3d-parallel
      - test_grib2:
            requires:
                - build_cmake_with_netcdf_and_xdmf_grib
            matrix:
                parameters:
                    test_name:
                        - adcirc_alaska_ice-2d
                        - adcirc_apes
                        - adcirc_apes-parallel
                        - adcirc_global-alidisp+buoyancy-2d-parallel
                        - adcirc_global_nws10-2d
                        - adcirc_global-tide-2d
                        - adcirc_global-tide+surge-2d
                        - adcirc_global-tide+surge-netcdfsal-2d
                        - adcirc_ideal_channel-2d-parallel
                        - adcirc_ideal_channel-woffset-2d-parallel
                        - adcirc_internal_overflow
                        - adcirc_internal_overflow-parallel
                        - adcirc_rivers
                        - adcirc_rivers-parallel
                        - adcirc_rivers-rotated-parallel
                        - adcirc_shinnecock_inlet
                        - adcirc_shinnecock_inlet-parallel
                        - adcirc_timevaryingweirs-parallel
                        - adcirc_baroclinic_2d_serial
                        - adcirc_baroclinic_2d_parallel
                        - adcirc_baroclinic_internaltide_2d
                        - adcirc_global-tide-2d-full-tip-JPL-emphemerides-serial
                        - adcirc_global-tide-2d-full-tip-analytical-parallel
                        - adcirc_global-nws14-inset-parallel
                        - adcirc_irene_cle15_lc12
                        - adcirc_irene_holland_legacy
                        - adcirc_irene_holland_new-parallel
