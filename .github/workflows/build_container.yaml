name: Build ADCIRC Workflow Template
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push:
        required: true
        type: boolean
    secrets:
      DOCKERHUB_LOGIN_USERNAME:
        required: true
      DOCKERHUB_LOGIN_TOKEN:
        required: true

jobs:
  adcirc-container:
    name: Build ADCIRC container
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LOGIN_TOKEN }}

      # Full history and tags are needed for the version string from git describe
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repository metadata would otherwise override the title, description,
      # and license labels set in the Dockerfile
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: adcircorg/adcirc
          tags: type=raw,value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=ADCIRC
            org.opencontainers.image.description=ADCIRC coastal circulation and storm surge model
            org.opencontainers.image.licenses=LicenseRef-ADCIRC
            org.opencontainers.image.version=${{ inputs.tag }}

      - name: Build and push ADCIRC Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./containers/Dockerfile
          push: ${{ inputs.push }}
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
