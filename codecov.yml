codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project: yes
    patch: yes
    changes: no

# Coverage is uploaded as a Cobertura report from gcovr. gfortran adds branches
# that are not in the source (I/O error handling, allocate status checks, loop
# guards), so most executed lines would otherwise count as partial, not covered.
parsers:
  cobertura:
    partials_as_hits: true

comment:
  layout: "header, diff"
  behavior: default
  require_changes: no

ignore:
  - thirdparty/**/*
